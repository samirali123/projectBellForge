name: Build installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: engine
      - run: npm install
        working-directory: app
      - run: npm run dist:mac
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: bellforge-mac
          path: |
            app/dist/*.dmg
            app/dist/*.zip

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: engine
      - run: npm install
        working-directory: app
      - run: npm run dist:win
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: bellforge-windows
          path: app/dist/*.exe
