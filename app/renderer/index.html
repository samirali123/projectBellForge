<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BellForge</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <header>
      <h1>BellForge</h1>
      <p id="subtitle" class="subtitle">CyberData bell schedule automation</p>
    </header>

    <!-- Screen 1: connect -->
    <section id="screen-connect" class="screen">
      <label class="field">
        <span>School</span>
        <select id="school-select">
          <option value="" disabled selected>Loading schools…</option>
        </select>
      </label>

      <div id="network-status" class="network-status" hidden>
        <span class="dot"></span>
        <span class="network-text"></span>
      </div>

      <label class="field">
        <span>Password</span>
        <input id="password" type="password" autocomplete="off" placeholder="School password" />
      </label>

      <button id="connect-btn" disabled>Connect</button>

      <div id="connect-error" class="error" hidden></div>
      <div id="connect-log" class="log" hidden></div>
    </section>

    <!-- Screen 2: mode -->
    <section id="screen-mode" class="screen" hidden>
      <p class="section-label">What do you want to schedule?</p>
      <div class="mode-grid">
        <button id="mode-single" class="mode-btn">
          <span class="mode-title">Single day</span>
          <span class="mode-desc">One date, one schedule type</span>
        </button>
        <button id="mode-range" class="mode-btn">
          <span class="mode-title">Date range</span>
          <span class="mode-desc">Assign a schedule to every date in a range</span>
        </button>
        <button id="mode-build" class="mode-btn wide">
          <span class="mode-title">New schedule type</span>
          <span class="mode-desc">Build a schedule that isn't in the list yet</span>
        </button>
      </div>
      <div id="mode-notice" class="notice" hidden></div>
      <div id="mode-warnings" class="error" hidden></div>
    </section>

    <!-- Screen 3: single day -->
    <section id="screen-single" class="screen" hidden>
      <button class="back-link" data-back="screen-mode">&larr; Back</button>
      <label class="field">
        <span>Date</span>
        <input id="single-date" type="date" />
      </label>
      <label class="field">
        <span>Schedule</span>
        <select id="single-schedule"></select>
      </label>
      <button id="single-review-btn">Review</button>
    </section>

    <!-- Screen 4: date range -->
    <section id="screen-range" class="screen" hidden>
      <button class="back-link" data-back="screen-mode">&larr; Back</button>
      <div class="range-dates">
        <label class="field">
          <span>Start date</span>
          <input id="range-start" type="date" />
        </label>
        <label class="field">
          <span>End date</span>
          <input id="range-end" type="date" />
        </label>
      </div>
      <button id="range-generate-btn">Generate dates</button>

      <div id="range-table-wrap" class="range-table-wrap" hidden>
        <table id="range-table" class="range-table">
          <tbody></tbody>
        </table>
        <button id="range-review-btn">Review</button>
      </div>
    </section>

    <!-- Screen: schedule builder -->
    <section id="screen-builder" class="screen" hidden>
      <button class="back-link" data-back="screen-mode">&larr; Back</button>
      <label class="field">
        <span>Schedule name</span>
        <input id="builder-label" type="text" placeholder="e.g. Spring Pep Rally" />
      </label>

      <p class="section-label">Blocks</p>
      <div id="builder-blocks" class="builder-blocks"></div>
      <div class="import-row">
        <button id="import-csv-btn" class="secondary">Import CSV…</button>
        <button id="csv-template-btn" class="link-btn">Get CSV template</button>
      </div>
      <div id="import-notice" class="notice" hidden></div>

      <div class="builder-form">
        <p class="section-label">Add a block</p>
        <div class="builder-row">
          <label class="field">
            <span>Title</span>
            <input id="block-title" type="text" placeholder="e.g. M1" />
          </label>
          <label class="field">
            <span>Color</span>
            <select id="block-color"></select>
          </label>
        </div>
        <label class="field">
          <span>Details (optional)</span>
          <input id="block-details" type="text" placeholder="Defaults to the title" />
        </label>
        <div class="builder-row">
          <label class="field">
            <span>Start time</span>
            <input id="block-start" type="time" />
          </label>
          <label class="field">
            <span>End time</span>
            <input id="block-end" type="time" />
          </label>
        </div>
        <label class="checkbox">
          <input id="block-point" type="checkbox" />
          <span>This is a point event, no end time</span>
        </label>
        <div id="block-errors" class="field-errors"></div>
        <button id="block-add-btn" disabled>Add Block</button>
      </div>

      <div id="builder-error" class="error" hidden></div>
      <button id="builder-preview-btn">Preview</button>
    </section>

    <!-- Screen: schedule builder preview -->
    <section id="screen-builder-preview" class="screen" hidden>
      <button class="back-link" data-back="screen-builder">&larr; Back to edit</button>
      <p class="section-label" id="preview-heading"></p>
      <p class="hint">
        These are the exact bells that will be created every time this schedule is used.
        Pass and Dismissal bells are added automatically.
      </p>
      <div id="preview-list" class="review-list"></div>
      <div id="preview-error" class="error" hidden></div>
      <button id="builder-save-btn">Save Schedule</button>
    </section>

    <!-- Screen 5: review -->
    <section id="screen-review" class="screen" hidden>
      <button class="back-link" id="review-back">&larr; Back</button>
      <p class="section-label">You are about to create</p>
      <div id="review-list" class="review-list"></div>
      <p id="review-total" class="review-total"></p>
      <button id="review-confirm-btn">Create Events</button>
    </section>

    <!-- Screen 6: progress -->
    <section id="screen-progress" class="screen" hidden>
      <p class="section-label" id="progress-heading">Creating events…</p>
      <div id="progress-log" class="log progress-log"></div>
      <div id="progress-summary" class="progress-summary" hidden></div>
      <button id="progress-done-btn" hidden>Done — start over</button>
    </section>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
