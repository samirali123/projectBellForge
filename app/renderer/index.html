<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BellForge</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <header>
      <h1>BellForge</h1>
      <p class="subtitle">CyberData bell schedule automation</p>
    </header>

    <label class="field">
      <span>School</span>
      <select id="school-select">
        <option value="" disabled selected>Loading schools…</option>
      </select>
    </label>

    <div id="network-status" class="network-status" hidden>
      <span class="dot"></span>
      <span class="network-text"></span>
    </div>

    <label class="field">
      <span>Password</span>
      <input id="password" type="password" autocomplete="off" placeholder="School password" />
    </label>

    <button id="connect-btn" disabled>Connect</button>

    <div id="error" class="error" hidden></div>

    <div id="log" class="log" hidden></div>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
